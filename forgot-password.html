<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03163d">
  <title>Forgot Password | LAVIDA Connect</title>
  <style>
    :root{--navy:#03163d;--gold:#f5b821;--ink:#071126;--muted:#667085;--line:#dfe5ee;--page:#f3f5f8;--bad:#b42318;--good:#08783e}
    *{box-sizing:border-box}html{background:var(--navy)}body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--navy) 0 40%,var(--page) 40% 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:grid;place-items:center}button,input{font:inherit}a{color:inherit}.shell{width:min(440px,100%);display:grid;gap:16px}.brand strong{display:block;color:#fff;font-size:31px;line-height:1;font-weight:950}.brand span{display:block;color:var(--gold);font-size:15px;font-weight:900;letter-spacing:1.4px;margin-top:6px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 18px 45px rgba(3,22,61,.18)}h1{margin:0;color:var(--navy);font-size:29px;line-height:1.05}p{margin:8px 0 0;color:#59657a;line-height:1.45}.form{display:grid;gap:14px;margin-top:20px}.field{display:grid;gap:7px;color:var(--navy);font-size:13px;font-weight:900}.field input{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;color:var(--ink);font-size:16px}.field input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,33,.24)}.primary{min-height:52px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:950;font-size:16px}.primary:disabled{opacity:.68;cursor:wait}.message{min-height:22px;margin:0;color:var(--muted);font-weight:800}.message.bad{color:var(--bad)}.message.ok{color:var(--good)}.back{display:flex;justify-content:center;color:var(--navy);font-weight:900;margin-top:12px}.footer{text-align:center;color:#dbe5f6;font-size:13px}.footer a{color:#fff;font-weight:900}
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand"><strong>LAVIDA</strong><span>Connect</span></header>
    <section class="card">
      <h1>Forgot password?</h1>
      <p>Enter your email address and LAVIDA Connect will send a secure password reset link.</p>
      <form id="forgotForm" class="form" novalidate>
        <label class="field" for="email">Email address<input id="email" type="email" autocomplete="email" inputmode="email" required></label>
        <p id="message" class="message" aria-live="polite"></p>
        <button id="sendButton" class="primary" type="submit">Send reset link</button>
      </form>
      <a id="signinLink" class="back" href="signin.html">Back to Sign In</a>
    </section>
    <p class="footer"><a href="marketplace.html#home">Back to LAVIDA Connect</a></p>
  </main>
  <script src="./vendor/supabase-js.js"></script>
  <script src="./lavida-auth.js"></script>
  <script>
    (function(){
      "use strict";
      const SUPABASE_URL = "https://cgvpoddtqswmtzvyrmwj.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNndnBvZGR0cXN3bXR6dnlybXdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNDE0OTMsImV4cCI6MjA5MTkxNzQ5M30.Ut_5jGo8L66zi8zxqR25nV_gkDBYLrT7p3Fx-4G5wGQ";
      const db = window.LavidaAuth.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const $ = (id) => document.getElementById(id);
      function setMessage(text,type){$("message").textContent=text||"";$("message").className=`message ${type||""}`.trim();}
      function returnTarget(){const params=new URLSearchParams(location.search);return params.get("returnTo")||sessionStorage.getItem("lavida_auth_return_to")||"marketplace.html#home";}
      $("signinLink").href = `signin.html?returnTo=${encodeURIComponent(returnTarget())}`;
      $("forgotForm").addEventListener("submit",async(event)=>{
        event.preventDefault();
        const email=$("email").value.trim();
        if(!email){setMessage("Enter your email address.","bad");return;}
        $("sendButton").disabled=true;$("sendButton").textContent="Sending...";
        try{
          const redirectTo = new URL("./reset-password.html", location.href).href;
          await db.auth.resetPasswordForEmail(email,{redirectTo});
          setMessage("If this email is registered with LAVIDA, a reset link will be sent.","ok");
        }catch(error){
          window.LavidaAuth.debug("dedicated password reset request failed",error,{email});
          setMessage(window.LavidaAuth.friendlyError(error,"LAVIDA could not send the reset link. Please try again."),"bad");
        }finally{
          $("sendButton").disabled=false;$("sendButton").textContent="Send reset link";
        }
      });
    })();
  </script>
</body>
</html>
