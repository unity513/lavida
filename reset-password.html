<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03163d">
  <title>Reset Password | LAVIDA Connect</title>
  <style>
    :root{--navy:#03163d;--gold:#f5b821;--ink:#071126;--muted:#667085;--line:#dfe5ee;--page:#f3f5f8;--bad:#b42318;--good:#08783e}
    *{box-sizing:border-box}html{background:var(--navy)}body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--navy) 0 35%,var(--page) 35% 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);padding:calc(20px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:grid;place-items:center}button,input{font:inherit}a{color:inherit}.shell{width:min(460px,100%);display:grid;gap:16px}.brand strong{display:block;color:#fff;font-size:31px;line-height:1;font-weight:950}.brand span{display:block;color:var(--gold);font-size:15px;font-weight:900;letter-spacing:1.4px;margin-top:6px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 18px 45px rgba(3,22,61,.18)}h1{margin:0;color:var(--navy);font-size:29px;line-height:1.05}p{margin:8px 0 0;color:#59657a;line-height:1.45}.form{display:grid;gap:13px;margin-top:18px}.field{display:grid;gap:7px;color:var(--navy);font-size:13px;font-weight:900}.input-wrap{position:relative}.field input{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;color:var(--ink);font-size:16px}.field input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,33,.24)}.field.with-eye input{padding-right:54px}.eye-button{position:absolute;right:5px;top:5px;width:42px;height:42px;border:0;border-radius:10px;background:transparent;color:var(--navy);display:grid;place-items:center}.eye-button svg{width:22px;height:22px;stroke:currentColor}.requirements{margin:0;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;color:#475467;font-size:13px;line-height:1.5}.requirements b{display:block;color:var(--navy);margin-bottom:4px}.requirements span{display:block}.requirements .ok{color:var(--good);font-weight:900}.primary{min-height:52px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:950;font-size:16px}.primary:disabled{opacity:.68;cursor:wait}.message{min-height:22px;margin:0;color:var(--muted);font-weight:800}.message.bad{color:var(--bad)}.message.ok{color:var(--good)}.back{display:flex;justify-content:center;color:var(--navy);font-weight:900;margin-top:12px}.hidden{display:none!important}.footer{text-align:center;color:#dbe5f6;font-size:13px}.footer a{color:#fff;font-weight:900}
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand"><strong>LAVIDA</strong><span>Connect</span></header>
    <section class="card">
      <h1>Create new password</h1>
      <p id="intro">Enter a new password for your LAVIDA Connect account.</p>
      <form id="resetForm" class="form" novalidate>
        <label class="field with-eye" for="newPassword">New password<span class="input-wrap"><input id="newPassword" type="password" autocomplete="new-password" required><button class="eye-button" type="button" data-toggle-password="newPassword" aria-label="Show new password"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
        <label class="field with-eye" for="confirmPassword">Confirm new password<span class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" required><button class="eye-button" type="button" data-toggle-password="confirmPassword" aria-label="Show confirm password"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
        <div class="requirements" aria-live="polite"><b>Password requirements</b><span id="reqLength">At least 8 characters</span><span id="reqUpper">One uppercase letter</span><span id="reqLower">One lowercase letter</span><span id="reqNumber">One number</span></div>
        <p id="message" class="message" aria-live="polite"></p>
        <button id="saveButton" class="primary" type="submit">Save New Password</button>
      </form>
      <a id="signinLink" class="back" href="signin.html">Back to Sign In</a>
    </section>
    <p class="footer"><a href="marketplace.html#home">Back to LAVIDA Connect</a></p>
  </main>
  <script src="./vendor/supabase-js.js"></script>
  <script src="./lavida-auth.js"></script>
  <script>
    (function(){
      "use strict";
      const SUPABASE_URL = "https://cgvpoddtqswmtzvyrmwj.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNndnBvZGR0cXN3bXR6dnlybXdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNDE0OTMsImV4cCI6MjA5MTkxNzQ5M30.Ut_5jGo8L66zi8zxqR25nV_gkDBYLrT7p3Fx-4G5wGQ";
      const db = window.LavidaAuth.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const $ = (id) => document.getElementById(id);
      let hasRecoverySession = false;
      function setMessage(text,type){$("message").textContent=text||"";$("message").className=`message ${type||""}`.trim();}
      function callbackError(){const hash=new URLSearchParams(location.hash.replace(/^#/,""));const query=new URLSearchParams(location.search);return hash.get("error_description")||hash.get("error")||query.get("error_description")||query.get("error");}
      function unavailable(text){$("resetForm").classList.add("hidden");$("intro").textContent=text;setMessage("Request a new reset link from LAVIDA Connect.","bad");}
      function checks(password){return {length:password.length>=8,upper:/[A-Z]/.test(password),lower:/[a-z]/.test(password),number:/\d/.test(password)};}
      function renderRequirements(){
        const state=checks($("newPassword").value);
        $("reqLength").classList.toggle("ok",state.length);
        $("reqUpper").classList.toggle("ok",state.upper);
        $("reqLower").classList.toggle("ok",state.lower);
        $("reqNumber").classList.toggle("ok",state.number);
        return Object.values(state).every(Boolean);
      }
      document.querySelectorAll("[data-toggle-password]").forEach((button)=>button.addEventListener("click",()=>{
        const input=$(button.dataset.togglePassword);
        const showing=input.type==="text";
        input.type=showing?"password":"text";
        button.setAttribute("aria-label",showing?"Show password":"Hide password");
      }));
      $("newPassword").addEventListener("input",renderRequirements);
      db.auth.onAuthStateChange((event,session)=>{
        if(event==="PASSWORD_RECOVERY" && session){hasRecoverySession=true;setMessage("Recovery link verified. Enter your new password.","ok");}
      });
      setTimeout(async()=>{
        const errorText=callbackError();
        if(errorText){unavailable("This password-reset link is expired or invalid.");return;}
        try{
          const session=await window.LavidaAuth.getSession(db);
          if(session){hasRecoverySession=true;setMessage("Recovery link verified. Enter your new password.","ok");}
          else if(!location.hash && !location.search){unavailable("This password-reset link is missing or expired.");}
        }catch(error){
          window.LavidaAuth.debug("password reset session check failed",error);
          unavailable(window.LavidaAuth.friendlyError(error,"This password-reset link is expired or invalid."));
        }
      },700);
      $("resetForm").addEventListener("submit",async(event)=>{
        event.preventDefault();
        const password=$("newPassword").value;
        const confirm=$("confirmPassword").value;
        if(!renderRequirements()){setMessage("Please meet all password requirements.","bad");return;}
        if(password!==confirm){setMessage("Passwords must match.","bad");return;}
        if(!hasRecoverySession){setMessage("This recovery link is expired or invalid.","bad");return;}
        $("saveButton").disabled=true;$("saveButton").textContent="Saving...";
        try{
          const {error}=await db.auth.updateUser({password});
          if(error) throw error;
          await window.LavidaAuth.signOut(db);
          setMessage("Password updated. Sign in with your new password.","ok");
          $("resetForm").classList.add("hidden");
          setTimeout(()=>{location.href="signin.html";},2200);
        }catch(error){
          window.LavidaAuth.debug("password update failed",error);
          setMessage(window.LavidaAuth.friendlyError(error,"Password could not be updated. Request a new reset link."),"bad");
        }finally{
          $("saveButton").disabled=false;$("saveButton").textContent="Save New Password";
        }
      });
      renderRequirements();
    })();
  </script>
</body>
</html>
