<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#03163d">
  <title>Create Account | LAVIDA Connect</title>
  <style>
    :root{--navy:#03163d;--gold:#f5b821;--ink:#071126;--muted:#667085;--line:#dfe5ee;--page:#f3f5f8;--bad:#b42318;--good:#08783e}
    *{box-sizing:border-box}html{background:var(--navy)}body{margin:0;min-height:100vh;background:linear-gradient(180deg,var(--navy) 0 34%,var(--page) 34% 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:var(--ink);padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));display:grid;place-items:center}button,input{font:inherit}a{color:inherit}.shell{width:min(470px,100%);display:grid;gap:16px}.brand strong{display:block;color:#fff;font-size:31px;line-height:1;font-weight:950}.brand span{display:block;color:var(--gold);font-size:15px;font-weight:900;letter-spacing:1.4px;margin-top:6px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 18px 45px rgba(3,22,61,.18)}h1{margin:0;color:var(--navy);font-size:29px;line-height:1.05}p{margin:8px 0 0;color:#59657a;line-height:1.45}.form{display:grid;gap:13px;margin-top:18px}.field{display:grid;gap:7px;color:var(--navy);font-size:13px;font-weight:900}.input-wrap{position:relative}.field input{width:100%;min-height:50px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 14px;color:var(--ink);font-size:16px}.field input:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 3px rgba(245,184,33,.24)}.field.with-eye input{padding-right:54px}.eye-button{position:absolute;right:5px;top:5px;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--navy);display:grid;place-items:center}.eye-button svg{width:22px;height:22px;stroke:currentColor}.terms{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start;color:#344054;font-size:13px;font-weight:800;line-height:1.4}.terms input{width:20px;height:20px;margin:0;accent-color:var(--gold)}.primary{min-height:52px;border:0;border-radius:12px;background:var(--navy);color:#fff;font-weight:950;font-size:16px}.primary:disabled{opacity:.68;cursor:wait}.message{min-height:22px;margin:0;color:var(--muted);font-weight:800}.message.bad{color:var(--bad)}.message.ok{color:var(--good)}.back{display:flex;justify-content:center;color:var(--navy);font-weight:900;margin-top:12px}.footer{text-align:center;color:#dbe5f6;font-size:13px}.footer a{color:#fff;font-weight:900}@media(max-width:380px){.card{padding:18px}.brand strong{font-size:28px}h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand"><strong>LAVIDA</strong><span>Connect</span></header>
    <section class="card">
      <h1>Create account</h1>
      <p>Create your LAVIDA Connect account for orders, printing, community and Games 365.</p>
      <form id="registerForm" class="form" novalidate>
        <label class="field" for="fullName">Full name<input id="fullName" autocomplete="name" required></label>
        <label class="field" for="email">Email address<input id="email" type="email" autocomplete="email" inputmode="email" required></label>
        <label class="field" for="phone">Phone number<input id="phone" type="tel" autocomplete="tel" inputmode="tel" required></label>
        <label class="field with-eye" for="password">Password<span class="input-wrap"><input id="password" type="password" autocomplete="new-password" required><button class="eye-button" type="button" data-toggle-password="password" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
        <label class="field with-eye" for="confirmPassword">Confirm password<span class="input-wrap"><input id="confirmPassword" type="password" autocomplete="new-password" required><button class="eye-button" type="button" data-toggle-password="confirmPassword" aria-label="Show confirm password"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button></span></label>
        <label class="terms"><input id="terms" type="checkbox" required><span>I agree to the LAVIDA Connect terms and privacy practices.</span></label>
        <p id="message" class="message" aria-live="polite"></p>
        <button id="registerButton" class="primary" type="submit">Create Account</button>
      </form>
      <a id="signinLink" class="back" href="signin.html">Back to Sign In</a>
    </section>
    <p class="footer"><a href="marketplace.html#home">Back to LAVIDA Connect</a></p>
  </main>
  <script src="./vendor/supabase-js.js"></script>
  <script src="./lavida-auth.js"></script>
  <script>
    (function(){
      "use strict";
      const SUPABASE_URL = "https://cgvpoddtqswmtzvyrmwj.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNndnBvZGR0cXN3bXR6dnlybXdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYzNDE0OTMsImV4cCI6MjA5MTkxNzQ5M30.Ut_5jGo8L66zi8zxqR25nV_gkDBYLrT7p3Fx-4G5wGQ";
      const db = window.LavidaAuth.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const $ = (id) => document.getElementById(id);
      function setMessage(text,type){$("message").textContent=text||"";$("message").className=`message ${type||""}`.trim();}
      function returnTarget(){const params=new URLSearchParams(location.search);return params.get("returnTo")||sessionStorage.getItem("lavida_auth_return_to")||"marketplace.html#home";}
      $("signinLink").href = `signin.html?returnTo=${encodeURIComponent(returnTarget())}`;
      document.querySelectorAll("[data-toggle-password]").forEach((button)=>button.addEventListener("click",()=>{
        const input = $(button.dataset.togglePassword);
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        button.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      }));
      function strongEnough(password){return password.length>=8 && /[A-Z]/.test(password) && /[a-z]/.test(password) && /\d/.test(password);}
      $("registerForm").addEventListener("submit",async(event)=>{
        event.preventDefault();
        const fullName=$("fullName").value.trim();
        const email=$("email").value.trim();
        const phone=$("phone").value.trim();
        const password=$("password").value;
        const confirm=$("confirmPassword").value;
        if(!fullName||!email||!phone){setMessage("Enter your full name, email address and phone number.","bad");return;}
        if(!strongEnough(password)){setMessage("Password must be at least 8 characters and include uppercase, lowercase and a number.","bad");return;}
        if(password!==confirm){setMessage("Passwords must match.","bad");return;}
        if(!$("terms").checked){setMessage("Please agree to the LAVIDA Connect terms and privacy practices.","bad");return;}
        $("registerButton").disabled=true;$("registerButton").textContent="Creating account...";
        try{
          const redirect = new URL(`./signin.html?returnTo=${encodeURIComponent(returnTarget())}`, location.href).href;
          const session = await window.LavidaAuth.signUp(db,email,password,{emailRedirectTo:redirect,data:{full_name:fullName,phone}});
          setMessage(session ? "Account created. Taking you back to LAVIDA Connect." : "Account created. Check your email to confirm it, then sign in.","ok");
          if(session){location.href = window.LavidaAuth.safeDestination(returnTarget(),"marketplace.html#home");}
        }catch(error){
          window.LavidaAuth.debug("dedicated registration failed",error,{email});
          setMessage(window.LavidaAuth.friendlyError(error,"We could not create your account. Please try again."),"bad");
        }finally{
          $("registerButton").disabled=false;$("registerButton").textContent="Create Account";
        }
      });
    })();
  </script>
</body>
</html>
